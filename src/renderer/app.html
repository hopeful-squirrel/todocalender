<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' app: https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'">
<title>하루칸</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div class="paper">
  <header class="titlebar">
    <span class="acc" style="display:flex">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12l-4 4H4z"/><path d="M16 20v-4h4"/></svg>
    </span>
    <span class="serif b">하루칸</span><span class="muted" id="viewTitle"></span>
    <span class="grow"></span>
    <label class="search nodrag" title="검색 (Ctrl+F)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E625A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">검색</span><input id="search" type="search" placeholder="할 일 · 링크 · 아이디어 검색">
    </label>
    <button class="tbtn" id="newTask" title="할 일 추가 (Ctrl+N)">+ 할 일</button>
    <button class="tbtn" id="openSettings" aria-label="설정" title="설정">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
    <span style="width:6px"></span>
    <button class="wbtn" data-win="min" aria-label="최소화"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="#2B2420"/></svg></button>
    <button class="wbtn" data-win="max" aria-label="최대화" id="maxBtn"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="#2B2420"/></svg></button>
    <button class="wbtn close" data-win="close" aria-label="닫기 (트레이로)"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="#2B2420"/></svg></button>
  </header>
  <section class="sheet"><div id="view"></div></section>
  <div class="grip" data-resize="l"></div><div class="grip" data-resize="r"></div><div class="grip" data-resize="t"></div><div class="grip" data-resize="b"></div>
  <div class="grip" data-resize="tl"></div><div class="grip" data-resize="tr"></div><div class="grip" data-resize="bl"></div><div class="grip" data-resize="br"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="보기 전환"></nav>
</div>
<div id="modal"></div>
<script type="module" src="app.js"></script>
</body>
</html>
