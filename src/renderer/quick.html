<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'">
<title>빠른 할 일 추가</title>
<link rel="stylesheet" href="base.css">
<style>
html, body { background: transparent; overflow: hidden; }
.q { margin: 12px; background: var(--sticky); border-radius: 6px; box-shadow: 0 16px 36px rgba(0,0,0,0.4); padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid var(--ink); }
.top { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-weight: 700; font-size: 15px; -webkit-app-region: drag; }
.top span.k { font-family: var(--sans); font-weight: 400; font-size: 11.5px; color: var(--sticky-ink); margin-left: auto; }
.in { display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 2px solid var(--ink); }
.in input { flex: 1; border: none; background: transparent; outline: none; font-size: 17px; min-width: 0; }
.in input::placeholder { color: #7D6C40; }
.chips { display: flex; gap: 6px; font-size: 12px; min-height: 22px; align-items: center; }
.chips span { padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,0.6); border: 1px solid rgba(43,36,32,0.25); }
.chips .muted { background: none; border: none; padding: 0; color: var(--sticky-ink); }
.cats { display: flex; gap: 6px; }
.cats button { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid rgba(43,36,32,0.3); background: transparent; }
.cats button.on { color: #fff; }
</style>
</head>
<body>
<div class="q">
  <div class="top">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A3B12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12l-4 4H4z"/><path d="M16 20v-4h4"/></svg>
    빠른 할 일 추가<span class="k">Enter 저장 · Esc 닫기</span>
  </div>
  <label class="in">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="sr">할 일</span>
    <input id="q" type="text" placeholder="예) 내일 3시 샘플 촬영 #작업" autofocus>
  </label>
  <div class="row" style="gap:10px">
    <div class="chips grow" id="chips"><span class="muted">날짜 · 시간 · #카테고리를 알아서 인식해요</span></div>
    <div class="cats" id="cats"></div>
  </div>
</div>
<script type="module" src="quick.js"></script>
</body>
</html>
