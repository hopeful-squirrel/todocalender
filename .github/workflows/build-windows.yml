name: Windows 빌드

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 설치파일 · 포터블 exe 빌드
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 빌드 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Harukan-Windows
          path: |
            dist/Harukan-Setup-*.exe
            dist/Harukan-Portable-*.exe
          if-no-files-found: error

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 릴리스에 exe 올리기 (바로 받기 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: 하루칸 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            Windows 10/11용 하루칸입니다.
            - **Harukan-Setup-${{ steps.ver.outputs.v }}.exe** — 설치형 (시작 메뉴 · 바탕화면 바로가기)
            - **Harukan-Portable-${{ steps.ver.outputs.v }}.exe** — 설치 없이 바로 실행
            처음 실행할 때 SmartScreen 경고가 뜨면 [추가 정보] › [실행]을 누르세요.
          files: |
            dist/Harukan-Setup-*.exe
            dist/Harukan-Portable-*.exe
